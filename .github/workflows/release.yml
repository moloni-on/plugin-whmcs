name: Release

# Build and publish the addon package when a version tag is created.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          extensions: curl, json, mbstring
          tools: composer:v2
          coverage: none

      # Gate the release on the same checks CI runs: a tag on a red commit must
      # not build and publish. These need the dev tooling (phpcs, PHPUnit), so
      # install with dev deps here...
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Lint (PSR-12)
        run: composer lint

      - name: Test
        run: composer test

      # ...then let build.sh do its own fresh --no-dev install, so the dev
      # tooling installed above never ends up in the shipped package.
      - name: Build package
        run: bash build.sh

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/moloni_on.zip
          generate_release_notes: true
